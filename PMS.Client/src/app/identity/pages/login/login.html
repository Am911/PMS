<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg col-12 col-md-6 col-lg-4">
    <div class="card-header bg-secondary text-white text-center">
      <h4 class="m-0">Login</h4>
    </div>
    <div class="card-body">
      <form>
        <div class="row">
          <div class="mb-3">
            <label for="userName" class="form-label required">Username</label>
            <div class="input-group">
              <input type="text" class="form-control" placeholder="Enter username" required />
              <span class="input-group-text"><i class="bi bi-pencil"></i></span>
            </div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label required">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" placeholder="Enter password" required />
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
            </div>
          </div>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
        </div>
      </form>
    </div>
  </div>
</div>
